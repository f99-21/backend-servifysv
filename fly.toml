# fly.toml app configuration file generated for servify-mobile on 2026-04-24T23:01:58-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'servify-mobile'
primary_region = 'dfw'

[build]

[env]
  JWT_EXPIRES_IN = '7d'
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
